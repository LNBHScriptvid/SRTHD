<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gửi Trần Hiểu Dư — Vũ Trụ Ngàn Sao</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mali:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090514;
      font-family: "Mali", system-ui, sans-serif;
      user-select: none;
    }
    canvas#universe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    #falling-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }
    .falling-phrase {
      position: absolute;
      top: 0;
      white-space: nowrap;
      font-weight: 600;
      letter-spacing: 0.02em;
      animation: fallText var(--dur, 13s) linear var(--delay, 0s) infinite;
      will-change: transform, opacity;
    }
    @keyframes fallText {
      0% { transform: translate3d(0, -14vh, 0) rotate(var(--t1, -3deg)); opacity: 0; }
      8% { opacity: var(--op, 0.85); }
      50% { transform: translate3d(var(--sway, 20px), 48vh, 0) rotate(var(--t2, 3deg)); opacity: var(--op, 0.85); }
      90% { opacity: var(--op, 0.85); }
      100% { transform: translate3d(calc(var(--sway, 20px) * -0.5), 112vh, 0) rotate(var(--t3, -2deg)); opacity: 0; }
    }
    #stage-wrap {
      position: relative;
      z-index: 20;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      pointer-events: none;
    }
    .glow-aura {
      position: absolute;
      width: min(78vw, 560px);
      height: min(45vw, 320px);
      border-radius: 9999px;
      filter: blur(56px);
      background: radial-gradient(circle, rgba(255,128,171,0.34) 0%, rgba(255,179,206,0.14) 50%, rgba(0,0,0,0) 75%);
    }
    .scene-3d {
      perspective: 1100px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 960px;
      min-height: 280px;
    }
    .preserve-3d { transform-style: preserve-3d; }
    .orbit-ring {
      position: absolute;
      width: min(84vw, 540px);
      height: min(84vw, 540px);
      border-radius: 9999px;
      border: 1px solid rgba(255, 182, 213, 0.2);
      animation: orbitRing 12s linear infinite;
    }
    .orbit-ring span {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) rotateX(-74deg);
      text-shadow: 0 0 12px rgba(255, 143, 177, 0.9);
    }
    @keyframes orbitRing {
      0% { transform: rotateX(74deg) rotateZ(0deg); }
      100% { transform: rotateX(74deg) rotateZ(360deg); }
    }
    .phrase-box {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s ease;
    }
    .phrase-box.entering { opacity: 0; transform: scale(0.5); }
    .spin-3d {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.14em 0.28em;
      animation: spin3dCute 7.5s linear infinite;
      transform-style: preserve-3d;
      text-align: center;
    }
    @keyframes spin3dCute {
      0% { transform: rotateY(0deg) rotateX(10deg) translateY(0px); }
      25% { transform: rotateY(90deg) rotateX(4deg) translateY(-8px); }
      50% { transform: rotateY(180deg) rotateX(-8deg) translateY(0px); }
      75% { transform: rotateY(270deg) rotateX(4deg) translateY(8px); }
      100% { transform: rotateY(360deg) rotateX(10deg) translateY(0px); }
    }
    .word {
      display: inline-flex;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 800;
      line-height: 1.12;
      transform-style: preserve-3d;
    }
    .char3d {
      position: relative;
      display: inline-block;
      transform-style: preserve-3d;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.85s ease;
    }
    .char3d .layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .char3d .front {
      position: relative;
      display: inline-block;
      color: #ffb8d0;
      transform: translateZ(1px);
      text-shadow: 0 0 18px rgba(255,143,177,0.9), 0 0 42px rgba(255,92,141,0.55), 0 2px 0 #ffe5ef;
    }
    #subtitle {
      margin-top: 14px;
      font-size: clamp(14px, 2vw, 17px);
      color: rgba(255, 214, 232, 0.92);
      text-shadow: 0 0 14px rgba(255, 143, 177, 0.8);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }
    #subtitle.show { opacity: 1; transform: translateY(0); }
    #replay-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 30;
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 194, 214, 0.24);
      background: rgba(15, 8, 30, 0.55);
      backdrop-filter: blur(8px);
      color: #ffd6e6;
      font-family: "Mali", sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #replay-btn:hover { background: rgba(255, 133, 173, 0.22); }
  </style>
</head>
<body>
  <canvas id="universe"></canvas>
  <div id="falling-layer"></div>
  <div id="stage-wrap">
    <div class="glow-aura"></div>
    <div class="scene-3d" id="scene-3d">
      <div class="orbit-ring preserve-3d">
        <span style="top:-12px;color:#ff9ebb;font-size:18px;">♡</span>
        <span style="bottom:-12px;color:#ffe599;font-size:16px;">✦</span>
      </div>
    </div>
    <div id="subtitle">♡ Ngôi sao sáng nhất trong vũ trụ của anh ✦</div>
  </div>
  <button id="replay-btn" type="button">Phát lại</button>

  <script>
    // 1. 5 câu chữ rơi khác nhau
    const fallingPhrases = [
      "Đừng giận Hoàng nhaa",
      "Cho Hoàng xin lõii",
      "Xin lõi bạn cutest",
      "Hãy đừng giậnn",
      "Chân thành lắm nha"
    ];
    const fallingColors = [
      { color: "#fbcfe8", shadow: "0 0 12px rgba(255,143,171,0.75)" },
      { color: "#ffe4e6", shadow: "0 0 12px rgba(255,194,209,0.75)" },
      { color: "#fef3c7", shadow: "0 0 12px rgba(255,224,153,0.7)" },
      { color: "#f5d0fe", shadow: "0 0 12px rgba(232,168,255,0.7)" },
      { color: "#fce7f3", shadow: "0 0 14px rgba(255,133,173,0.8)" }
    ];
    const fallingLayer = document.getElementById("falling-layer");
    for (let i = 0; i < 15; i++) {
      const idx = i % fallingPhrases.length;
      const el = document.createElement("span");
      const lane = i % 5;
      const wave = Math.floor(i / 5);
      const dur = 11.5 + ((i * 1.7) % 5.5);
      el.className = "falling-phrase";
      el.textContent = fallingPhrases[idx];
      el.style.left = Math.min(82, 4 + lane * 18.5 + wave * 4.5) + "%";
      el.style.fontSize = "clamp(12px, 1.3vw, " + (13 + (i % 3) * 1.5) + "px)";
      el.style.color = fallingColors[idx].color;
      el.style.textShadow = fallingColors[idx].shadow;
      el.style.setProperty("--dur", dur + "s");
      el.style.setProperty("--delay", -((i * 2.6) % dur) + "s");
      el.style.setProperty("--sway", ((i % 2 === 0 ? 1 : -1) * (16 + (i % 4) * 7)) + "px");
      el.style.setProperty("--op", String(0.72 + (i % 3) * 0.08));
      fallingLayer.appendChild(el);
    }

    // 2. Vũ trụ đầy ngôi sao sáng dễ thương
    const canvas = document.getElementById("universe");
    const ctx = canvas.getContext("2d");
    let w = window.innerWidth, h = window.innerHeight;
    const starColors = ["#ffffff", "#ffe5f1", "#ffd1e6", "#fff4d2", "#e7dcff"];
    const stars = [];
    const particles = [];
    const shooting = [];
    let frame = 0, nextShoot = 100;

    function resize() {
      w = window.innerWidth; h = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    for (let i = 0; i < 200; i++) {
      const sparkle = Math.random() < 0.24;
      stars.push({
        x: Math.random() * w, y: Math.random() * h,
        r: sparkle ? 2.5 + Math.random() * 3.2 : 0.7 + Math.random() * 1.9,
        alpha: 0.4 + Math.random() * 0.6,
        speed: 0.015 + Math.random() * 0.035,
        phase: Math.random() * Math.PI * 2,
        color: starColors[i % starColors.length],
        sparkle
      });
    }

    function spawnBurst(cx, cy, count) {
      const colors = ["#ff8fab", "#ffb3c6", "#ffc2d1", "#ffd166", "#e0aaff"];
      for (let i = 0; i < count; i++) {
        const a = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const sp = 1.5 + Math.random() * 4;
        particles.push({
          x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.5,
          size: 7 + Math.random() * 8, life: 0, max: 52 + Math.random() * 30,
          color: colors[i % colors.length], rot: (Math.random() - 0.5) * 0.6
        });
      }
    }
    window.addEventListener("pointerdown", (e) => spawnBurst(e.clientX, e.clientY, 14));

    function drawSparkle(x, y, r, alpha, color, rot) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = r * 3;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const rad = i % 2 === 0 ? r : r * 0.28;
        const a = (i * Math.PI) / 4;
        if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
        else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    function drawHeart(x, y, s, alpha, color, rot) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 10;
      const k = s * 0.52;
      ctx.beginPath();
      ctx.moveTo(0, k * 0.45);
      ctx.bezierCurveTo(-k * 1.2, -k * 0.55, -k * 0.65, -k * 1.45, 0, -k * 0.55);
      ctx.bezierCurveTo(k * 0.65, -k * 1.45, k * 1.2, -k * 0.55, 0, k * 0.45);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    function loop() {
      frame++;
      const g = ctx.createRadialGradient(w * 0.5, h * 0.46, 20, w * 0.5, h * 0.5, Math.max(w, h) * 0.85);
      g.addColorStop(0, "#22113c"); g.addColorStop(0.45, "#140929"); g.addColorStop(1, "#06030e");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

      const dx = Math.sin(frame * 0.004) * 26, dy = Math.cos(frame * 0.003) * 16;
      const n1 = ctx.createRadialGradient(w * 0.25 + dx, h * 0.3 + dy, 0, w * 0.25 + dx, h * 0.3 + dy, Math.max(w, h) * 0.38);
      n1.addColorStop(0, "rgba(255,130,178,0.13)"); n1.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = n1; ctx.fillRect(0, 0, w, h);
      const n2 = ctx.createRadialGradient(w * 0.76 - dx, h * 0.68 - dy, 0, w * 0.76 - dx, h * 0.68 - dy, Math.max(w, h) * 0.4);
      n2.addColorStop(0, "rgba(186,135,255,0.11)"); n2.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = n2; ctx.fillRect(0, 0, w, h);

      for (const s of stars) {
        const tw = 0.45 + 0.55 * Math.sin(frame * s.speed + s.phase);
        if (s.sparkle) drawSparkle(s.x, s.y, s.r * (0.85 + 0.3 * tw), s.alpha * tw, s.color, Math.sin(frame * 0.01 + s.phase) * 0.2);
        else {
          ctx.save(); ctx.globalAlpha = s.alpha * tw; ctx.fillStyle = s.color;
          ctx.shadowColor = s.color; ctx.shadowBlur = s.r * 4;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }
      }

      if (frame >= nextShoot) {
        nextShoot = frame + 150 + Math.random() * 180;
        const a = Math.PI * (0.18 + Math.random() * 0.14);
        const sp = 7 + Math.random() * 4;
        shooting.push({ x: w * (0.15 + Math.random() * 0.7), y: h * (0.05 + Math.random() * 0.25), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: 48 });
      }
      for (let i = shooting.length - 1; i >= 0; i--) {
        const st = shooting[i]; st.x += st.vx; st.y += st.vy; st.life++;
        const op = Math.max(0, 1 - st.life / st.max);
        ctx.save(); ctx.strokeStyle = "rgba(255,194,209," + op + ")"; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(st.x, st.y); ctx.lineTo(st.x - st.vx * 10, st.y - st.vy * 10); ctx.stroke(); ctx.restore();
        if (st.life >= st.max) shooting.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.life++;
        drawHeart(p.x, p.y, p.size, Math.max(0, 1 - p.life / p.max), p.color, p.rot);
        if (p.life >= p.max) particles.splice(i, 1);
      }
      requestAnimationFrame(loop);
    }
    loop();

    // 3. Hiệu ứng chữ 3D xoay vòng màu hồng & tách ra mỗi 5 giây
    const scene = document.getElementById("scene-3d");
    const subtitle = document.getElementById("subtitle");
    const depthLayers = [
      { z: -1, c: "#ff7aa2" }, { z: -2.5, c: "#ff6b97" }, { z: -4, c: "#f7598a" },
      { z: -5.5, c: "#ed477c" }, { z: -7, c: "#e0356e" }, { z: -9, c: "#b81a52" }
    ];
    const sequence = [
      { text: "Xin lỗi", size: "clamp(3.25rem, 11vw, 7.5rem)" },
      { text: "Bạn dễ thương nhất", size: "clamp(2.1rem, 6.4vw, 5.25rem)" },
      { text: "Trần Hiểu Dư", size: "clamp(2.5rem, 7.8vw, 6.25rem)" }
    ];
    let timers = [];
    let currentBox = null;

    function createPhraseBox(item) {
      const box = document.createElement("div");
      box.className = "phrase-box entering";
      const spin = document.createElement("div");
      spin.className = "spin-3d";
      const words = item.text.split(" ");
      let idx = 0;
      const total = item.text.length;
      words.forEach((word) => {
        const wSpan = document.createElement("span");
        wSpan.className = "word";
        wSpan.style.fontSize = item.size;
        Array.from(word).forEach((ch) => {
          const cSpan = document.createElement("span");
          cSpan.className = "char3d";
          cSpan.dataset.idx = String(idx++);
          cSpan.dataset.total = String(total);
          depthLayers.forEach((dl) => {
            const l = document.createElement("span");
            l.className = "layer";
            l.textContent = ch;
            l.style.color = dl.c;
            l.style.transform = "translateZ(" + dl.z + "px)";
            cSpan.appendChild(l);
          });
          const front = document.createElement("span");
          front.className = "front";
          front.textContent = ch;
          cSpan.appendChild(front);
          wSpan.appendChild(cSpan);
        });
        idx++;
        spin.appendChild(wSpan);
      });
      box.appendChild(spin);
      scene.appendChild(box);
      requestAnimationFrame(() => requestAnimationFrame(() => box.classList.remove("entering")));
      return box;
    }

    function splitAndRemove(box) {
      if (!box) return;
      spawnBurst(w / 2, h / 2, 32);
      const chars = box.querySelectorAll(".char3d");
      chars.forEach((c) => {
        const i = Number(c.dataset.idx || 0);
        const tot = Number(c.dataset.total || 1);
        const offset = i - (tot - 1) / 2;
        const dir = offset === 0 ? 1 : Math.sign(offset);
        const tx = dir * (70 + Math.abs(offset) * 40);
        const ty = (i % 2 === 0 ? -1 : 1) * (60 + ((i * 37) % 80));
        const tz = (i % 3 === 0 ? 1 : -1) * (90 + ((i * 41) % 120));
        c.style.transform = "translate3d(" + tx + "px," + ty + "px," + tz + "px) rotateX(" + (dir * 55) + "deg) rotateY(" + (dir * 85) + "deg) scale(0.3)";
        c.style.opacity = "0";
      });
      setTimeout(() => box.remove(), 950);
    }

    function startSequence() {
      timers.forEach(clearTimeout);
      timers = [];
      scene.querySelectorAll(".phrase-box").forEach((el) => el.remove());
      subtitle.classList.remove("show");

      currentBox = createPhraseBox(sequence[0]);

      timers.push(setTimeout(() => {
        splitAndRemove(currentBox);
        currentBox = createPhraseBox(sequence[1]);
      }, 8000));

      timers.push(setTimeout(() => {
        splitAndRemove(currentBox);
        currentBox = createPhraseBox(sequence[2]);
        timers.push(setTimeout(() => subtitle.classList.add("show"), 600));
      }, 10000));
    }

    document.getElementById("replay-btn").addEventListener("click", startSequence);
    startSequence();
  </script>
</body>
</html>`;
}
